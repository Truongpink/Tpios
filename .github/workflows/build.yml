name: Build TPIOS dylib

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Compile Objective-C sources
        run: |
          rm -rf build
          mkdir -p build
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"

          for source in TPIOSBootstrap.m CHMTouchBackend.m TPIOSModelFilter.m TPIOSGADPresentationBlocker.m; do
            object="build/${source%.m}.o"
            xcrun clang \
              -target arm64-apple-ios15.0 \
              -isysroot "$SDKROOT" \
              -fobjc-arc \
              -c "$source" \
              -o "$object"
          done

      - name: Compile Swift sources
        run: |
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"

          swiftc \
            -target arm64-apple-ios15.0 \
            -sdk "$SDKROOT" \
            -emit-library \
            -module-name TPIOS \
            -Xlinker -dylib \
            -Xlinker -undefined \
            -Xlinker dynamic_lookup \
            -o build/TPIOS.dylib \
            *.swift \
            build/TPIOSBootstrap.o \
            build/CHMTouchBackend.o \
            build/TPIOSModelFilter.o \
            build/TPIOSGADPresentationBlocker.o

      - name: Package dylib
        id: version
        run: |
          VERSION=$(printf "%02d" "$GITHUB_RUN_NUMBER")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p package
          cp build/TPIOS.dylib "package/tpios${VERSION}.dylib"
          echo "TPIOS version: $VERSION"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: "TPIOS-${{ steps.version.outputs.version }}"
          path: "package/tpios${{ steps.version.outputs.version }}.dylib"

      - name: Backup source sang GitLab
        if: always()
        continue-on-error: true
        run: |
          git remote add backup "https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/tpios-group1/truongpink-tpios.git"
          git push backup "HEAD:refs/heads/auto/${GITHUB_REPOSITORY#*/}" --force
